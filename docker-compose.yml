services:
  asterisk:
    image: ${DOCKERHUB_NAMESPACE:-blazux}/prismvox-asterisk:${PRISMVOX_TAG:-unstable}
    build: ./asterisk
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    environment:
      - ARI_USER=${ARI_USER:-phoneagent}
      - ARI_PASS=${ARI_PASS:-change_me}
      - SIP_REGISTRAR=${SIP_REGISTRAR}
      - SIP_REGISTRAR_IP=${SIP_REGISTRAR_IP}
      - SIP_REGISTRAR_MATCH=${SIP_REGISTRAR_MATCH:-${SIP_REGISTRAR_IP}}
      - SIP_USERNAME=${SIP_USERNAME}
      - SIP_PASSWORD=${SIP_PASSWORD}
      - SIP_TLS_PORT=${SIP_TLS_PORT:-5061}
      - SIP_UDP_PORT=${SIP_UDP_PORT:-5060}
      - SIP_TRANSPORT_MODE=${SIP_TRANSPORT_MODE:-tls}
      - SIP_TLS_VERIFY_SERVER=${SIP_TLS_VERIFY_SERVER:-}
      - SIP_TLS_CA_FILE=${SIP_TLS_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
      - SIP_DOMAIN=${SIP_DOMAIN}
      - DEBUG=${DEBUG:-false}
    extra_hosts:
      - "${SIP_DOMAIN}:${SIP_REGISTRAR_IP}"
    volumes:
      - sounds:/usr/share/asterisk/sounds/custom
      # Dynamic SIP trunk, re-rendered + reloaded from the UI (shared with ui)
      - asterisk_dynamic:/etc/asterisk/dynamic
    networks:
      - agentnet
    restart: unless-stopped

  agent:
    image: ${DOCKERHUB_NAMESPACE:-blazux}/prismvox-agent:${PRISMVOX_TAG:-unstable}
    build: ./agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ARI_HOST=asterisk
      - ARI_PORT=8088
      - ARI_USER=${ARI_USER:-phoneagent}
      - ARI_PASS=${ARI_PASS:-change_me}
      - ARI_APP=phoneagent
      - LOG_SENSITIVE_DATA=${LOG_SENSITIVE_DATA:-false}
      - APP_HOST=agent
      - SOUNDS_DIR=/sounds
      - WAIT_CUE_WAV=${WAIT_CUE_WAV:-}
      # Barge-in sustain threshold (ms of voiced speech). Raised from 800 to reduce
      # self-interruption from acoustic echo (agent hearing its own playback) —
      # echo accrues voiced frames continuously, so it reaches any threshold on a
      # long enough sentence; the empty-transcript echo recovery in handler.go
      # catches those, this just lets short answers finish uncut.
      - BARGEIN_MS=${BARGEIN_MS:-2000}
      # External speech services or direct ElevenLabs (default).
      # Direct ElevenLabs mode streams audio inside the call agent.
      - TTS_SPELL_ACRONYMS=${TTS_SPELL_ACRONYMS:-true}
      - TTS_SPELL_WORDS=${TTS_SPELL_WORDS:-}
      - TTS_SPELL_EXCEPTIONS=${TTS_SPELL_EXCEPTIONS:-OK}
      - TTS_URL=${TTS_URL:-http://tts:8000/synthesize}
      # OpenAI-compatible language model gateway.
      # OPENAI_BASE_URL is the /v1 root — the same convention as Prism, so the
      # same value serves both stacks. No default here on purpose: it would
      # shadow the SGLANG_URL fallback below and silently point an old .env at
      # the wrong host. The value lives in .env (see .env.example).
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      # Empty = unauthenticated gateway (the usual case on a trusted LAN).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Deprecated pre-rename spellings (host root, WITHOUT /v1). Forwarded so an
      # existing .env keeps working: the code adds /v1 and logs a warning.
      - SGLANG_URL=${SGLANG_URL:-}
      - SGLANG_MODEL=${SGLANG_MODEL:-}
      # Prism dock: set PRISM_URL and a recognised caller is answered by Prism's
      # agent instead of the local LLM loop. Strangers stay on the local brain —
      # that is the switchboard's own job. Empty = standalone Vox.
      - PRISM_URL=${PRISM_URL:-}
      - PRISM_TOKEN=${PRISM_TOKEN:-}
      # Deprecated pre-rename spellings, forwarded so the code's fallback is
      # actually reachable from an existing .env.
      - CORTEX_URL=${CORTEX_URL:-}
      - CORTEX_TOKEN=${CORTEX_TOKEN:-}
      - STT_URL=${STT_URL:-http://stt:9000}
      - STT_PROVIDER=${STT_PROVIDER:-elevenlabs}
      - TTS_PROVIDER=${TTS_PROVIDER:-elevenlabs}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      - ELEVENLABS_STT_MODEL=${ELEVENLABS_STT_MODEL:-scribe_v2_realtime}
      - ELEVENLABS_TTS_MODEL=${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_LANGUAGE=${ELEVENLABS_LANGUAGE:-fr}
      - ELEVENLABS_STABILITY=${ELEVENLABS_STABILITY:-}
      - SPEECH_SERVICE_API_KEY=${SPEECH_SERVICE_API_KEY:-}
      - STT_MODEL=${STT_MODEL:-}
      - TTS_MODEL=${TTS_MODEL:-}
      - TTS_VOICE=${TTS_VOICE:-}
      - EMBEDDINGS_URL=http://embeddings:8002
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - SIP_DOMAIN=${SIP_DOMAIN}
      - DATABASE_URL=postgresql://phoneagent:${DB_PASS:-change_me}@db:5432/phoneagent
      # On a network with an outbound proxy (e.g. Squid), it must not swallow
      # internal Docker-network calls (agent → tts/stt/embeddings/asterisk) —
      # observed as a bare Squid 503 on the TTS/STT call, nothing in the
      # agent's own logs pointing at the proxy. Prepends onto whatever
      # HTTP(S)_PROXY/NO_PROXY the host/daemon already injects.
      - NO_PROXY=tts,stt,asterisk,embeddings,db,localhost,127.0.0.1,${NO_PROXY:-}
      - no_proxy=tts,stt,asterisk,embeddings,db,localhost,127.0.0.1,${no_proxy:-}
    volumes:
      - sounds:/sounds
      - secrets:/var/lib/prismvox:ro
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    # Single-homed on purpose: the agent pre-resolves APP_HOST to an IP for
    # Asterisk's ExternalMedia RTP target. A second network would make "agent"
    # resolve to the wrong IP and silently kill all inbound audio. Prism joins
    # THIS network instead (see the Prism compose) — never the reverse.
    networks:
      - agentnet
    restart: unless-stopped

  embeddings:
    image: ${DOCKERHUB_NAMESPACE:-blazux}/prismvox-embeddings:${PRISMVOX_TAG:-unstable}
    build: ./embeddings
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
    networks:
      - agentnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8002/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ui:
    image: ${DOCKERHUB_NAMESPACE:-blazux}/prismvox-ui:${PRISMVOX_TAG:-unstable}
    build: ./ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${UI_BIND:-127.0.0.1}:7860:7860"
      # HTTPS — required by the browser for microphone access (voice-cloning
      # "Record" button): plain http://<ip>:7860 is not a secure context, so
      # navigator.mediaDevices is undefined there. Self-signed cert, generated
      # on first boot by docker-entrypoint.sh, persisted in the ui_certs volume.
      - "${UI_BIND:-127.0.0.1}:7861:7861"
    volumes:
      # Shared with asterisk: the UI re-renders pjsip_trunk.conf here, then reloads PJSIP via ARI
      - asterisk_dynamic:/asterisk-dynamic
      - ui_certs:/certs
      - secrets:/var/lib/prismvox
    environment:
      - DATABASE_URL=postgresql://phoneagent:${DB_PASS:-change_me}@db:5432/phoneagent
      # Optional extra SAN entry for the self-signed cert (e.g. IP:192.168.1.50
      # for this box's LAN IP) so the browser's certificate warning matches the
      # address you actually browse to. Not required — a mismatch just adds a
      # second click-through, it doesn't block the mic.
      - UI_TLS_SAN=${UI_TLS_SAN:-}
      # Same switch as the agent. Set → the console page retires and points at
      # Prism, which owns the operator surface and drives it through our API.
      # The API itself stays up — that proxy is what does the driving. Empty →
      # standalone Vox, full console.
      - PRISM_URL=${PRISM_URL:-}
      - PRISM_PUBLIC_URL=${PRISM_PUBLIC_URL:-}
      - CORTEX_URL=${CORTEX_URL:-}
      # Admin Basic authentication and a separate token for agent API clients.
      - UI_USER=${UI_USER:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      # OpenAI-compatible language model gateway.
      # OPENAI_BASE_URL is the /v1 root — the same convention as Prism, so the
      # same value serves both stacks. No default here on purpose: it would
      # shadow the SGLANG_URL fallback below and silently point an old .env at
      # the wrong host. The value lives in .env (see .env.example).
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      # Empty = unauthenticated gateway (the usual case on a trusted LAN).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Deprecated pre-rename spellings (host root, WITHOUT /v1). Forwarded so an
      # existing .env keeps working: the code adds /v1 and logs a warning.
      - SGLANG_URL=${SGLANG_URL:-}
      - SGLANG_MODEL=${SGLANG_MODEL:-}
      - STT_URL=${STT_URL:-http://stt:9000}
      - TTS_URL=${TTS_URL:-http://tts:8000/synthesize}
      - STT_PROVIDER=${STT_PROVIDER:-elevenlabs}
      - TTS_PROVIDER=${TTS_PROVIDER:-elevenlabs}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      - ELEVENLABS_STT_MODEL=${ELEVENLABS_STT_MODEL:-scribe_v2_realtime}
      - ELEVENLABS_TTS_MODEL=${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_LANGUAGE=${ELEVENLABS_LANGUAGE:-fr}
      - ELEVENLABS_STABILITY=${ELEVENLABS_STABILITY:-}
      - SPEECH_SERVICE_API_KEY=${SPEECH_SERVICE_API_KEY:-}
      - STT_MODEL=${STT_MODEL:-}
      - TTS_MODEL=${TTS_MODEL:-}
      - TTS_VOICE=${TTS_VOICE:-}
      - EMBEDDINGS_URL=http://embeddings:8002
      - ARI_URL=http://asterisk:8088
      - ARI_USER=${ARI_USER:-phoneagent}
      - ARI_PASS=${ARI_PASS:-change_me}
      - ASTERISK_DYNAMIC_DIR=/asterisk-dynamic
      # SIP_* seed the config table on first run; afterwards the UI is the source of truth
      - SIP_REGISTRAR=${SIP_REGISTRAR}
      - SIP_REGISTRAR_IP=${SIP_REGISTRAR_IP}
      - SIP_REGISTRAR_MATCH=${SIP_REGISTRAR_MATCH:-${SIP_REGISTRAR_IP}}
      - SIP_USERNAME=${SIP_USERNAME}
      - SIP_PASSWORD=${SIP_PASSWORD}
      - SIP_TLS_PORT=${SIP_TLS_PORT:-5061}
      - SIP_UDP_PORT=${SIP_UDP_PORT:-5060}
      - SIP_TRANSPORT_MODE=${SIP_TRANSPORT_MODE:-tls}
      - SIP_DOMAIN=${SIP_DOMAIN}
      # Dictionary seeds the config table on first run; afterwards the UI owns it.
      - WHISPER_HOTWORDS=${WHISPER_HOTWORDS:-}
      - TTS_SPELL_WORDS=${TTS_SPELL_WORDS:-}
      - TTS_SPELL_EXCEPTIONS=${TTS_SPELL_EXCEPTIONS:-OK}
      # Same proxy gotcha as the agent service — see its NO_PROXY comment above.
      - NO_PROXY=tts,stt,asterisk,embeddings,db,localhost,127.0.0.1,${NO_PROXY:-}
      - no_proxy=tts,stt,asterisk,embeddings,db,localhost,127.0.0.1,${no_proxy:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agentnet
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=phoneagent
      - POSTGRES_PASSWORD=${DB_PASS:-change_me}
      - POSTGRES_DB=phoneagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agentnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoneagent -d phoneagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sounds:
  pgdata:
  asterisk_dynamic:
  ui_certs:
  secrets:

networks:
  # Docking happens HERE: prism-server joins this network (as external
  # `vox_agentnet`) so vox-agent can reach it by name. The agent stays single-homed
  # so its ExternalMedia RTP IP resolves correctly.
  agentnet:
    driver: bridge
