[general]
static = yes
writeprotect = no

[from-trunk]
exten => _[+0-9X].,1,NoOp(Prism Vox — incoming call: ${CALLERID(all)} -> ${EXTEN})
 same => n,Stasis(phoneagent)
 same => n,Hangup()

exten => s,1,NoOp(Prism Vox — incoming call without DNIS: ${CALLERID(all)})
 same => n,Stasis(phoneagent)
 same => n,Hangup()

exten => h,1,NoOp(Call ended)

; ── Blind transfer target — agent calls continueInDialplan with this context ──
[transfer]
exten => _X.,1,Dial(PJSIP/${EXTEN}@phoneagent-endpoint)
 same => n,Hangup()

exten => _+X.,1,Dial(PJSIP/${EXTEN}@phoneagent-endpoint)
 same => n,Hangup()
