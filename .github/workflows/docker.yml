name: Build & Push Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prismvox_test
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: prismvox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prismvox_test -d prismvox_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VOX_TEST_DATABASE_URL: postgres://prismvox_test:fixture@localhost:5432/prismvox_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ui/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base ffmpeg libsndfile1
          python -m pip install -r ui/requirements.txt httpx
      - name: Check Go code
        working-directory: agent
        run: go vet ./...
      - name: Test call agent
        working-directory: agent
        run: go test -race ./...
      - name: Test console and archive
        run: python -m unittest discover -s ui/tests -p 'test_*.py'
      - name: Test tool trace rendering
        run: node --test ui/tests/call-log-tools.cjs

  build:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [agent, ui, asterisk, embeddings]
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in this repository Actions secrets.'
            exit 1
          fi
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/prismvox-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prismvox-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=prismvox-${{ matrix.service }}
