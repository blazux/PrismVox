name: Build & Push Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prismvox_test
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: prismvox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prismvox_test -d prismvox_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VOX_TEST_DATABASE_URL: postgres://prismvox_test:fixture@localhost:5432/prismvox_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ui/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base ffmpeg libsndfile1
          python -m pip install -r ui/requirements.txt httpx
      - name: Check Go code
        working-directory: agent
        run: go vet ./...
      - name: Check vulnerable Go calls
        working-directory: agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Test call agent
        working-directory: agent
        run: go test -race -p 1 ./...
      - name: Test console and archive
        run: python -m unittest discover -s ui/tests -p 'test_*.py'
      - name: Test console interactions
        run: node --test ui/tests/call-log-tools.cjs ui/tests/embedding-provider.cjs ui/tests/outbound-create.cjs ui/tests/release-tags.cjs ui/tests/sip-draft.cjs ui/tests/outbound-pages.cjs
      - name: Build telephony runtime candidate
        run: docker build --pull -t prismvox-asterisk:ci-test asterisk
      - name: Test isolated telephony runtime
        run: bash asterisk/tests/run-smoke.sh prismvox-asterisk:ci-test python:3.11-slim

  build:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [agent, ui, asterisk]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo '::error::The runner does not match the target architecture'; exit 1 ;;
          esac
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in this repository Actions secrets.'
            exit 1
          fi
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Identify stable release
        id: release
        run: echo "stable=$(bash scripts/is-stable-release.sh "$GITHUB_REF")" >> "$GITHUB_OUTPUT"
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/prismvox-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push ${{ matrix.service }} by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          pull: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prismvox-${{ matrix.service }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prismvox-${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prismvox-${{ matrix.service }}-${{ matrix.arch }}
      - name: Test native telephony image
        if: matrix.service == 'asterisk'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prismvox-${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash asterisk/tests/run-smoke.sh "$IMAGE@$DIGEST" python:3.11-slim
      - name: Export image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests/$ARCH"
          touch "$RUNNER_TEMP/digests/$ARCH/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [agent, ui, asterisk]
    steps:
      - uses: actions/checkout@v4
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in this repository Actions secrets.'
            exit 1
          fi
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Identify stable release
        id: release
        run: echo "stable=$(bash scripts/is-stable-release.sh "$GITHUB_REF")" >> "$GITHUB_OUTPUT"
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/prismvox-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Publish and verify multi-platform image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prismvox-${{ matrix.service }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          bash scripts/publish-docker-manifest.sh
